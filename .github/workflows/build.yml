name: APK

# Кожен пуш у main — нова збірка в Releases; Марнотрат качає останню за постійним посиланням
# releases/latest/download/marnotrat-widget.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ключ підпису
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Збірка
        run: gradle --no-daemon :app:assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: widget
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}

      - run: cp app/build/outputs/apk/release/app-release.apk marnotrat-widget.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: 0.1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: marnotrat-widget.apk
          make_latest: true
